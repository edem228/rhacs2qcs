<text x="614" y="884" font-size="13" font-weight="700" fill="#FF7A45">Clé de déduplication → ETM (Generic CSV)</text>
<text x="614" y="908" font-size="12" fill="#ECECEC">L'identité d'une vuln image = <tspan fill="#FF7A45" font-weight="700">digest</tspan> (Image.metadata.v2.digest) + <tspan fill="#FF7A45" font-weight="700">CVE</tspan> (ImageCVE.cve) + <tspan fill="#FF7A45" font-weight="700">package</tspan> (ImageComponent.name)</text>
<text x="614" y="928" font-size="12" fill="#ECECEC">+ <tspan fill="#FF7A45" font-weight="700">version</tspan> (ImageComponent.version) — soit exactement l'arête <tspan fill="#FF7A45">ComponentCVEEdge</tspan> du graphe. Le hostname synthétique reste cluster/namespace/deployment.</text>
<text x="614" y="954" font-size="11" fill="#8B919B">IMAGE_CVE et NODE_CVE = deux flux / connecteurs distincts (la chaîne Node passe par Node → NodeComponent → NodeCVE, pas par Image).</text>
<text x="40" y="996" font-size="10.5" fill="#8B919B">Source : proto/storage/*.proto (stackrox/stackrox, branche master). Champs résumés ; types réels en CVSSV2/V3, EmbeddedVulnerability, ImageScan, etc.</text>
